name: smart_motel_manager
description: Ứng dụng quản lý phòng trọ thông minh
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Local database (Repository Pattern - dễ thay bằng Firestore sau này)
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # ID sinh dạng UUID
  uuid: ^4.4.0

  # Mã hóa dữ liệu
  crypto: ^3.0.3

  # Format ngày tháng, tiền tệ
  intl: ^0.19.0

  # Giao diện đẹp / font chữ hỗ trợ tiếng Việt tốt
  google_fonts: ^6.2.1

  # Dashboard charts
  fl_chart: ^0.68.0

  qr_flutter: ^4.1.0

  mobile_scanner: ^5.2.3

  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.13.0

  screenshot: ^3.0.0

  share_plus: ^10.0.2

  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
